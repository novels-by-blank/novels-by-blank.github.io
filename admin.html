<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Admin — Novel by Blank</title>

  <link rel="stylesheet" href="style.css">

</head>


<body>

  <main class="admin-page">

    <div class="admin-container">

      <div class="admin-header">

        <p class="eyebrow">
          NOVEL BY BLANK
        </p>

        <h1>
          Admin Dashboard
        </h1>

        <p class="admin-description">
          Manage customer payments and full novel access.
        </p>

      </div>


      <!-- PAYMENT SUBMISSIONS -->

      <section class="admin-card">

        <div class="admin-card-header">

          <div>

            <h2>
              Payment Submissions
            </h2>

            <p>
              Customer payment details will appear here.
            </p>

          </div>

        </div>


        <div id="payments-container">

          <p class="admin-empty">
            No payment submissions loaded yet.
          </p>

        </div>

      </section>


    </div>

  </main>


  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script src="admin.js"></script>

</body>

</html>
